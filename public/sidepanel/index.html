<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>X-Ray</title>

  <link rel="stylesheet" href="sidepanel.css">
</head>

<body>
  <main>
    <h1>X-Ray</h1>

    <section>
      <p>Selected term:</p>
      <strong id="selected-term">Nothing selected</strong>
    </section>
    <section>
      <h2>Summary</h2>
      <p id="summary">No summary yet.</p>
    </section>
    <section>
      <h2>Matching passages</h2>

      <p id="match-count">0 matches</p>

      <div id="passages">
        <p>Select a term on the webpage.</p>
      </div>
    </section>
    <section class="cache-controls">
  <button id="clear-cache" type="button">
    Clear cache
  </button>

  <span id="cache-status"></span>
</section>
  </main>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
